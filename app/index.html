<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TireLab Dev</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="app-header">
    <h1>TireLab — dev-версия</h1>
    <p>Модульный каркас для миграции legacy-модели.</p>
    <nav class="top-links">
      <a href="../index.html">На главную</a>
      <a href="../legacy/tire_reduced_fem_model_original.html">Legacy-прототип</a>
    </nav>
  </header>

  <main class="layout">
    <section class="panel" aria-label="Панель параметров">
      <h2>Параметры</h2>
      <form id="params-form" class="params-form">
        <label>Нагрузка, Н
          <input name="loadN" type="number" value="3500" step="50" />
        </label>
        <label>Давление, кПа
          <input name="pressureKpa" type="number" value="220" step="5" />
        </label>
        <label>Радиус колеса, м
          <input name="radiusM" type="number" value="0.31" step="0.01" />
        </label>
        <label>Ширина шины, м
          <input name="widthM" type="number" value="0.205" step="0.005" />
        </label>
        <button id="calculate-btn" type="submit">Рассчитать</button>
      </form>
    </section>

    <section class="panel" aria-label="Визуализация">
      <h2>Деформация шины</h2>
      <canvas id="tire-canvas" width="700" height="320"></canvas>
    </section>

    <section class="panel" aria-label="Результаты">
      <h2>Результаты</h2>
      <div id="results-panel">Нет результатов. Нажмите «Рассчитать».</div>
    </section>

    <aside class="panel" aria-label="Статус">
      <h2>Статус</h2>
      <div id="status-panel">Готов к расчету.</div>
    </aside>
  </main>

  <script src="src/state.js"></script>
  <script src="src/model/params.js"></script>
  <script src="src/model/units.js"></script>
  <script src="src/model/geometry.js"></script>
  <script src="src/model/contact.js"></script>
  <script src="src/model/brush.js"></script>
  <script src="src/model/solver.js"></script>
  <script src="src/model/results.js"></script>
  <script src="src/render/colors.js"></script>
  <script src="src/render/wheelView.js"></script>
  <script src="src/render/contactPatchView.js"></script>
  <script src="src/render/plotView.js"></script>
  <script src="src/ui/presets.js"></script>
  <script src="src/ui/controls.js"></script>
  <script src="src/ui/report.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
